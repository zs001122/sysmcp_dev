[project]
name = "sysmcp-core"
version = "0.1.0"
description = "Small FastMCP foundation for independently packaged business MCP services"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastmcp==4.0.10",
  "pydantic>=2.12,<3",
]

[project.scripts]
sysmcp-probe = "sysmcp_core.probe:main"

[dependency-groups]
dev = [
  "httpx2>=2.13,<3",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.2,<2",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sysmcp_core"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

