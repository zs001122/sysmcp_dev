[project]
name = "sysmcp-biz-t100"
version = "0.9.2"
description = "T100 employee create/query/update and controlled account maintenance"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "sysmcp-core==0.1.0",
  "fastmcp==4.0.10",
  "pydantic>=2.12,<3",
  "httpx==0.28.1",
  "anyio>=4.9,<5",
  "starlette==1.7.0",
  "uvicorn==0.54.0",
  "cryptography==50.0.1",
]

[project.scripts]
sysmcp-t100 = "biz_t100.cli:main"

[tool.uv.sources]
sysmcp-core = { path = "../core/dist/sysmcp_core-0.1.0-py3-none-any.whl" }

[dependency-groups]
dev = ["pytest>=8.4,<10", "pytest-asyncio>=1.2,<2", "ruff>=0.12,<1", "httpx2>=2.13,<3"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/biz_t100"]

[tool.hatch.build.targets.sdist]
exclude = ["/.runtime/**"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
